<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#263238">
<title>工事写真マネージャー V5</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f3f5f6;
  color:#263238;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}
header{
  background:#263238;
  color:#fff;
  padding:20px 16px;
}
header h1{margin:0;font-size:24px}
header p{margin:6px 0 0;color:#d5dde1}

main{
  max-width:720px;
  margin:auto;
  padding:14px;
}
.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 5px 18px #0000000d;
}
label{
  display:block;
  font-weight:700;
  margin:12px 0 6px;
}
input[type=text],textarea{
  width:100%;
  font-size:16px;
  padding:12px;
  border:1px solid #cfd8dc;
  border-radius:10px;
}
textarea{
  min-height:90px;
  resize:vertical;
}
.row{
  display:flex;
  gap:8px;
}
.row>*{flex:1}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px 10px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}
.primary{
  background:#263238;
  color:#fff;
}
.secondary{
  background:#e9eef1;
  color:#263238;
}
button:disabled{
  opacity:.45;
}
.check{
  display:flex;
  align-items:center;
  gap:10px;
  margin:8px 0;
}
.check input{
  width:26px;
  height:26px;
}
.note{
  color:#607d8b;
  line-height:1.7;
}
#preview{
  width:100%;
  display:none;
  border-radius:12px;
  margin-top:12px;
}
.photoItem{
  border-top:1px solid #e5e7e9;
  padding:14px 0;
}
.photoItem:first-child{border-top:0}
.photoItem img{
  width:100%;
  border-radius:10px;
  margin-top:8px;
}
.empty{
  color:#78909c;
  text-align:center;
  padding:25px 5px;
}
.deleteBtn{
  margin-top:8px;
  background:#eceff1;
}
footer{
  padding:20px;
  text-align:center;
  color:#78909c;
  font-size:12px;
}
</style>
</head>

<body>

<header>
  <h1>📷 工事写真マネージャー V5</h1>
  <p>撮影・写真選択・電子黒板をシンプルに</p>
</header>

<main>

<section class="card">
  <label>工事名</label>
  <input id="project" type="text" placeholder="例：○○道路改良工事">

  <label>工種</label>
  <input id="work" type="text" placeholder="例：舗装工">

  <div class="check">
    <input id="numbering" type="checkbox">
    <label for="numbering" style="margin:0">
      測点を自動で番号付けする
    </label>
  </div>

  <p class="note">
    チェックすると測点が No.1、No.2…と自動で付きます。
    工種には番号を付けません。
  </p>

  <label>説明</label>
  <textarea id="desc" placeholder="例：ハツリ状況"></textarea>
</section>

<section class="card">
  <h2>① 写真を選ぶ</h2>

  <div class="row">
    <button id="cameraBtn" class="primary">📷 カメラで撮影</button>
    <button id="libraryBtn" class="secondary">🖼️ 写真から選択</button>
  </div>

  <input id="camera" type="file" accept="image/*" capture="environment" hidden>
  <input id="library" type="file" accept="image/*" hidden>

  <img id="preview" alt="選択した写真">

  <p class="note">
    iPhoneのカメラ撮影と、すでに保存してある写真の選択を別々にできます。
  </p>
</section>

<section class="card">
  <h2>② 電子黒板</h2>

  <div class="check">
    <input id="board" type="checkbox" checked>
    <label for="board" style="margin:0">
      黒板を写真に自動で入れる
    </label>
  </div>

  <p class="note">
    工種・測点・説明から黒板を作成し、写真の右下に貼り付けます。
  </p>

  <div class="row">
    <button id="saveBtn" class="primary" disabled>💾 写真を保存</button>
    <button id="clearBtn" class="secondary">クリア</button>
  </div>
</section>

<section class="card">
  <h2>📖 写真帳プレビュー</h2>
  <div id="book"></div>
</section>

</main>

<footer>
この試作版は端末のブラウザ内に保存します。
</footer>

<canvas id="canvas" hidden></canvas>

<script>
const $ = id => document.getElementById(id);

let selectedFile = null;
let nextNumber = Number(localStorage.getItem("kp5_next") || 1);

let photos = [];
try{
  photos = JSON.parse(localStorage.getItem("kp5_photos") || "[]");
}catch(e){
  photos = [];
}

function showFile(file){
  if(!file) return;

  selectedFile = file;
  $("saveBtn").disabled = false;

  const reader = new FileReader();

  reader.onload = function(e){
    $("preview").src = e.target.result;
    $("preview").style.display = "block";
  };

  reader.readAsDataURL(file);
}

$("cameraBtn").addEventListener("click", function(){
  $("camera").click();
});

$("libraryBtn").addEventListener("click", function(){
  $("library").click();
});

$("camera").addEventListener("change", function(){
  if(this.files && this.files[0]){
    showFile(this.files[0]);
  }
});

$("library").addEventListener("change", function(){
  if(this.files && this.files[0]){
    showFile(this.files[0]);
  }
});

function readFile(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function makePhoto(file,useBoard,number){
  const dataUrl = await readFile(file);
  const img = await loadImage(dataUrl);

  const canvas = $("canvas");
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(img,0,0);

  if(useBoard){
    const w = Math.max(300,Math.floor(canvas.width * .44));
    const h = Math.max(150,Math.floor(canvas.height * .22));

    const x = canvas.width - w - Math.floor(canvas.width * .03);
    const y = canvas.height - h - Math.floor(canvas.height * .04);

    ctx.fillStyle = "#263238";
    ctx.fillRect(x,y,w,h);

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = Math.max(2,canvas.width/700);
    ctx.strokeRect(x,y,w,h);

    const work = $("work").value || "未入力";
    const desc = $("desc").value || "";
    const point = number ? "No." + number : "－";

    const lines = [
      "工種　" + work,
      "測点　" + point,
      "説明　" + desc
    ];

    ctx.fillStyle = "#ffffff";
    ctx.textBaseline = "middle";
    ctx.font = "bold " + Math.max(18,Math.floor(h/7)) + "px sans-serif";

    const lineHeight = h/3;

    lines.forEach((text,i)=>{
      ctx.fillText(
        text,
        x + Math.floor(w*.05),
        y + lineHeight*(i+.5),
        Math.floor(w*.9)
      );
    });
  }

  return canvas.toDataURL("image/jpeg",0.88);
}

$("saveBtn").addEventListener("click", async function(){

  if(!selectedFile){
    alert("先に写真を選んでください");
    return;
  }

  const file = selectedFile;

  $("saveBtn").disabled = true;
  $("saveBtn").textContent = "保存中…";

  try{
    const useNumber = $("numbering").checked;
    const number = useNumber ? nextNumber : null;

    const finishedImage = await makePhoto(
      file,
      $("board").checked,
      number
    );

    photos.push({
      project:$("project").value || "未入力",
      work:$("work").value || "未入力",
      desc:$("desc").value || "",
      number:number,
      img:finishedImage,
      date:new Date().toLocaleString("ja-JP")
    });

    if(useNumber){
      nextNumber++;
      localStorage.setItem("kp5_next",String(nextNumber));
    }

    localStorage.setItem("kp5_photos",JSON.stringify(photos));

    selectedFile = null;
    $("camera").value = "";
    $("library").value = "";
    $("preview").src = "";
    $("preview").style.display = "none";

    render();

    alert("写真を保存しました 👍");

  }catch(error){
    console.error(error);
    alert("写真の保存中にエラーが発生しました。別の写真でもう一度お試しください。");
  }finally{
    $("saveBtn").textContent = "💾 写真を保存";
    $("saveBtn").disabled = selectedFile === null;
  }
});

$("clearBtn").addEventListener("click", function(){
  selectedFile = null;
  $("camera").value = "";
  $("library").value = "";
  $("preview").src = "";
  $("preview").style.display = "none";
  $("saveBtn").disabled = true;
});

function escapeHtml(text){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#39;");
}

function render(){
  const book = $("book");

  if(!photos.length){
    book.innerHTML = '<div class="empty">まだ写真がありません。</div>';
    return;
  }

  book.innerHTML = photos.map((p,i)=>{
    const point = p.number ? "No."+p.number : "－";

    return `
      <div class="photoItem">
        <strong>${escapeHtml(p.project)}</strong>
        <div>工種：${escapeHtml(p.work)}</div>
        <div>測点：${escapeHtml(point)}</div>
        <div>説明：${escapeHtml(p.desc)}</div>
        <div>${escapeHtml(p.date || "")}</div>
        <img src="${p.img}" alt="工事写真">
        <button class="deleteBtn" onclick="deletePhoto(${i})">
          この写真を削除
        </button>
      </div>
    `;
  }).join("");
}

window.deletePhoto = function(index){
  if(!confirm("この写真を削除しますか？")) return;

  photos.splice(index,1);
  localStorage.setItem("kp5_photos",JSON.stringify(photos));
  render();
};

render();
</script>

</body>
</html>
